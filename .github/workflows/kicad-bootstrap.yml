name: Bootstrap generated KiCad schematic

on:
  push:
    branches: [hardware/kicad-schematic-v1]
    paths:
      - 'hardware/wiring.csv'
      - 'hardware/kicad/gen_schematic.py'
      - '.github/workflows/kicad-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Generate schematic
        run: python hardware/kicad/gen_schematic.py

      - name: Commit generated schematic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hardware/kicad/MF35X_Tracker.kicad_sch
          if git diff --cached --quiet; then
            echo "Generated schematic already up to date."
          else
            git commit -m "Generate KiCad schematic [skip ci]"
            git push
          fi
