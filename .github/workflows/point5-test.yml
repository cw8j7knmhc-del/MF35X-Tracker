name: Point 5 isolated patch and compile

on:
  push:
    branches:
      - feature/point5-device-owned-max-alarm
    paths:
      - 'tools/point5_patch.py'
      - '.github/workflows/point5-test.yml'

permissions:
  contents: write

jobs:
  patch-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/point5-device-owned-max-alarm

      - name: Apply Point 5 patch
        run: python3 tools/point5_patch.py

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check admin.js

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core 3.3.11
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.11 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Install libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "TinyGPSPlus"
          arduino-cli lib install "Adafruit ADS1X15"
          arduino-cli lib install "Adafruit MAX31855 library"

      - name: Compile V5.9.13 with OPI PSRAM
        run: |
          rm -rf build
          mkdir -p build
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3 \
            --board-options PSRAM=opi \
            --output-dir build \
            esp32/MF35X_Livetracker

      - name: Show size and intended diff
        run: |
          ls -lh build/*.ino.bin
          git diff --stat
          git diff --name-only

      - name: Commit tested Point 5 product files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            esp32/MF35X_Livetracker/MF35X_Livetracker.ino \
            esp32/MF35X_Livetracker/MF35X_Livetracker_core.hpp \
            esp32/MF35X_Livetracker/device_metrics_alarm.hpp \
            esp32/MF35X_Livetracker/firmware_version.h \
            script.js \
            admin.js
          if git diff --cached --quiet; then
            echo "Keine Produktänderungen zu committen."
            exit 0
          fi
          git commit -m "V5.9.13: move max values and alarm history to ESP32"
          git push
