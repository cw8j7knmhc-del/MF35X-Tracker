name: Fix admin output defaults

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-admin-output-defaults.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Align admin defaults
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('admin.js')
          text = path.read_text(encoding='utf-8')
          old = '''const DEFAULT_OUTPUT_CONFIG = {\n  speed_enable_kmh: 60,\n  rpm_on: 3200,\n  rpm_off: 3150\n};'''
          new = '''const DEFAULT_OUTPUT_CONFIG = {\n  speed_enable_kmh: 60,\n  rpm_on: 2500,\n  rpm_off: 2450\n};'''

          if old not in text:
              raise SystemExit('Erwarteter DEFAULT_OUTPUT_CONFIG-Block wurde nicht gefunden; nichts geändert.')

          text = text.replace(old, new, 1)
          if text.count('rpm_on: 2500') < 1 or text.count('rpm_off: 2450') < 1:
              raise SystemExit('Prüfung nach Patch fehlgeschlagen.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Syntax check
        run: node --check admin.js

      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.js
          git commit -m "Align admin GPIO11 defaults to 2500/2450 rpm"
          git pull --rebase origin main
          git push origin HEAD:main
