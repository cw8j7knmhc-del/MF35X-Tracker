name: Test V5.9.12 admin syntax

on:
  push:
    branches: [feature/v5.9.12-offline-race-buffer]
    paths:
      - '.github/workflows/test-v5912-web.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v5.9.12-offline-race-buffer

      - name: Check admin JavaScript syntax
        run: node --check admin.js

      - name: Verify offline buffer UI ids
        run: |
          set -euo pipefail
          grep -q 'id="offlineBufferStatus"' admin.html
          grep -q 'id="offlineBufferDetail"' admin.html
          grep -q 'historyOfflinePending' admin.js
          grep -q 'Offline-Renndaten nachsendet' admin.js
