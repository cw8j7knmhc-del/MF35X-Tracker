name: Apply V5.9.12 offline race buffer v2

on:
  push:
    branches: [feature/v5.9.12-offline-race-buffer]
    paths:
      - '.github/workflows/apply-v5912-offline-buffer-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v5.9.12-offline-race-buffer
          fetch-depth: 0

      - name: Apply verified patch helper
        run: |
          set -euo pipefail
          python3 tools/apply_v5912_patch.py
          git diff --check

      - name: Verify allowed scope and commit
        run: |
          set -euo pipefail

          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"

          allowed='^(esp32/MF35X_Livetracker/MF35X_Livetracker_core.hpp|esp32/MF35X_Livetracker/MF35X_Livetracker.ino|esp32/MF35X_Livetracker/firmware_version.h|esp32/MF35X_Livetracker/offline_race_buffer.hpp|admin.html|admin.js|.github/workflows/build-firmware.yml)$'
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if ! printf '%s\n' "$file" | grep -Eq "$allowed"; then
              echo "Unerwartete geaenderte Datei: $file"
              exit 1
            fi
          done <<< "$changed"

          rm -f .github/workflows/apply-v5912-offline-buffer.yml
          rm -f .github/workflows/apply-v5912-offline-buffer-v2.yml
          rm -f tools/apply_v5912_patch.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "V5.9.12: add durable offline race buffer"
          git push origin feature/v5.9.12-offline-race-buffer
