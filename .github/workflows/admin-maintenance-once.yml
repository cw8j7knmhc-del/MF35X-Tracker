name: One-shot MF35X admin maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-maintenance-once.yml'

permissions:
  contents: write

jobs:
  patch-admin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch and normalize admin files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          core_path = Path('admin-core.js')
          html_path = Path('admin.html')
          if not core_path.exists():
              raise SystemExit('admin-core.js fehlt')

          js = core_path.read_text(encoding='utf-8')

          old = '  gps_update_ms: 100,\n  history_update_ms: 5000'
          new = '  gps_update_ms: 1000,\n  history_update_ms: 5000'
          if js.count(old) != 1:
              raise SystemExit(f'GPS-Default-Muster unerwartet: {js.count(old)} Treffer')
          js = js.replace(old, new, 1)

          old = 'ref(db, `tracker/history/${raceId}`),'
          new = 'ref(db, `tracker/races/${raceId}/samples`),'
          if js.count(old) != 1:
              raise SystemExit(f'Rennhistorie-Pfad unerwartet: {js.count(old)} Treffer')
          js = js.replace(old, new, 1)

          js = js.replace('/* MF35X Tracker Admin V9.5.8 */', '/* MF35X Tracker Admin V9.5.12 */', 1)
          Path('admin.js').write_text(js, encoding='utf-8')
          core_path.unlink()

          html = html_path.read_text(encoding='utf-8')
          html = html.replace('<title>MF35X Admin V9.5.11</title>', '<title>MF35X Admin V9.5.12</title>', 1)
          html = html.replace('<div class="version">Version 9.5.11</div>', '<div class="version">Version 9.5.12</div>', 1)
          html = html.replace(
              'Position und Geschwindigkeit gemeinsam · einstellbar 100–3000 ms · Standard 100 ms',
              'Position und Geschwindigkeit gemeinsam · einstellbar 100–3000 ms · Standard 1000 ms',
              1
          )

          old_import = 'await import(`./admin.js?v=9.5.11-${Date.now()}`);'
          new_import = (
              'await import(`./admin.js?v=9.5.12-${Date.now()}`);\n'
              '  await import(`./admin-reset-fix.js?v=9.5.12-${Date.now()}`);'
          )
          if html.count(old_import) != 1:
              raise SystemExit(f'admin.js-Import unerwartet: {html.count(old_import)} Treffer')
          html = html.replace(old_import, new_import, 1)
          html = html.replace('./firebase-config.js?v=9.5.11-', './firebase-config.js?v=9.5.12-', 1)

          html_path.write_text(html, encoding='utf-8')
          PY

      - name: Verify targeted fixes
        run: |
          set -euo pipefail
          test ! -e admin-core.js
          grep -Fq 'const ADMIN_PASSWORD' admin.js
          grep -Fq 'gps_update_ms: 1000' admin.js
          grep -Fq 'tracker/races/${raceId}/samples' admin.js
          grep -Fq 'admin-reset-fix.js?v=9.5.12' admin.html
          grep -Fq 'Standard 1000 ms' admin.html

      - name: Commit patched admin files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.js admin.html admin-core.js
          git commit -m "Normalize admin buttons and race analysis [skip ci]"
          git push
