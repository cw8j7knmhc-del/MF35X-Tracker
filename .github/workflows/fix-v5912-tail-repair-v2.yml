name: Fix V5.9.12 LittleFS tail repair v2

on:
  push:
    branches: [feature/v5.9.12-offline-race-buffer]
    paths:
      - '.github/workflows/fix-v5912-tail-repair-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v5.9.12-offline-race-buffer
          fetch-depth: 0

      - name: Apply compatible LittleFS repair
        run: |
          set -euo pipefail
          python3 tools/fix_v5912_tail.py
          git diff --check

      - name: Commit source fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add esp32/MF35X_Livetracker/offline_race_buffer.hpp
          git commit -m "Fix LittleFS power-loss tail repair"
          git push origin feature/v5.9.12-offline-race-buffer
