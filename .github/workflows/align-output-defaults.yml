name: Align output defaults

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/align-output-defaults.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Align admin and firmware fallback defaults
        run: |
          python3 - <<'PY'
          from pathlib import Path

          admin = Path('admin.js')
          text = admin.read_text(encoding='utf-8')
          old = '''const DEFAULT_OUTPUT_CONFIG = {\n  speed_enable_kmh: 60,\n  rpm_on: 3200,\n  rpm_off: 3150\n};'''
          new = '''const DEFAULT_OUTPUT_CONFIG = {\n  speed_enable_kmh: 60,\n  rpm_on: 2500,\n  rpm_off: 2450\n};'''
          if text.count(old) != 1:
              raise SystemExit(f'admin.js: erwarteter Default-Block nicht eindeutig gefunden ({text.count(old)})')
          admin.write_text(text.replace(old, new, 1), encoding='utf-8')

          core = Path('esp32/MF35X_Livetracker/MF35X_Livetracker_core.hpp')
          text = core.read_text(encoding='utf-8')
          old = '''OutputConfig outputConfig = {\n  60.0f,\n  3200.0f,\n  3150.0f\n};'''
          new = '''OutputConfig outputConfig = {\n  60.0f,\n  2500.0f,\n  2450.0f\n};'''
          if text.count(old) != 1:
              raise SystemExit(f'Core: erwarteter Default-Block nicht eindeutig gefunden ({text.count(old)})')
          core.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Check admin JavaScript syntax
        run: node --check admin.js

      - name: Verify exact defaults
        run: |
          grep -A4 'const DEFAULT_OUTPUT_CONFIG' admin.js
          grep -A4 'OutputConfig outputConfig' esp32/MF35X_Livetracker/MF35X_Livetracker_core.hpp

      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.js esp32/MF35X_Livetracker/MF35X_Livetracker_core.hpp
          git commit -m "Align output defaults to 60 kmh and 2500/2450 rpm"
          git pull --rebase origin main
          git push origin HEAD:main
