name: Validate V5.9.21 async race logger

on:
  push:
    branches:
      - prepared/v5.9.21-async-race-logger
    paths:
      - 'esp32/**'
      - '.github/workflows/validate-v5921-async-race-logger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core 3.3.11
        run: |
          arduino-cli core update-index \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.11 \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Install libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "TinyGPSPlus"
          arduino-cli lib install "Adafruit ADS1X15"
          arduino-cli lib install "Adafruit MAX31855 library"

      - name: Compile ESP32-S3 firmware
        run: |
          rm -rf build
          mkdir -p build
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3 \
            --board-options PSRAM=opi \
            --warnings all \
            --output-dir build \
            esp32/MF35X_Livetracker

      - name: Verify prepared version
        run: |
          grep -q 'MF35X_FIRMWARE_VERSION "V5.9.21"' esp32/MF35X_Livetracker/firmware_version.h
          grep -q 'v5921_async_race_logger.hpp' esp32/MF35X_Livetracker/MF35X_Livetracker.ino
