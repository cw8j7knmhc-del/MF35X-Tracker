name: Apply V5.9.12 offline race buffer v3

on:
  push:
    branches: [feature/v5.9.12-offline-race-buffer]
    paths:
      - '.github/workflows/apply-v5912-offline-buffer-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v5.9.12-offline-race-buffer
          fetch-depth: 0

      - name: Apply scoped source patch
        run: |
          set -euo pipefail
          python3 tools/apply_v5912_patch.py

          # Der Hilfspatcher kennt bereits die spaetere PSRAM-Buildoption.
          # Auf dem Feature-Branch wird der produktive Build-Workflow aber
          # absichtlich NICHT veraendert; PSRAM wird separat kompiliert getestet.
          git checkout origin/main -- .github/workflows/build-firmware.yml
          git diff --check

          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          allowed='^(esp32/MF35X_Livetracker/MF35X_Livetracker_core.hpp|esp32/MF35X_Livetracker/MF35X_Livetracker.ino|esp32/MF35X_Livetracker/firmware_version.h|esp32/MF35X_Livetracker/offline_race_buffer.hpp|admin.html|admin.js)$'
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if ! printf '%s\n' "$file" | grep -Eq "$allowed"; then
              echo "Unerwartete geaenderte Datei: $file"
              exit 1
            fi
          done <<< "$changed"

      - name: Commit feature sources only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html admin.js \
                  esp32/MF35X_Livetracker/MF35X_Livetracker.ino \
                  esp32/MF35X_Livetracker/MF35X_Livetracker_core.hpp \
                  esp32/MF35X_Livetracker/firmware_version.h \
                  esp32/MF35X_Livetracker/offline_race_buffer.hpp
          git diff --cached --check
          git commit -m "V5.9.12: add durable offline race buffer"
          git push origin feature/v5.9.12-offline-race-buffer
