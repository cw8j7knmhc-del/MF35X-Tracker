name: Fix push legacy fallback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-push-legacy-fallback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch legacy FCM fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('cloudflare/mf35x-push-watch/src/index.js')
          text = path.read_text(encoding='utf-8')

          old = '''  // Bestehenden Einzel-Token waehrend der Migration als Fallback behalten.\n  // Sobald dasselbe Token als Geraet registriert ist, verhindert die Map ein Duplikat.\n  const legacyToken = String(env.FCM_TOKEN || "").trim();\n  if (legacyToken && !recipients.has(legacyToken)) {\n    recipients.set(legacyToken, {\n      name: "Legacy-FCM-Empfänger",\n      token: legacyToken\n    });\n  }\n'''

          new = '''  // Legacy-Einzel-Token nur verwenden, solange noch KEIN Gerät in der\n  // Mehrgeräteverwaltung registriert ist. Sobald mindestens ein Gerät existiert,\n  // gelten ausschließlich dessen Master-Schalter und Benachrichtigungskategorien.\n  const legacyToken = String(env.FCM_TOKEN || "").trim();\n  if (devices.length === 0 && legacyToken) {\n    recipients.set(legacyToken, {\n      name: "Legacy-FCM-Empfänger",\n      token: legacyToken\n    });\n  }\n'''

          if old not in text:
              raise SystemExit('Erwarteter Legacy-Fallback-Block wurde nicht gefunden; nichts geändert.')

          updated = text.replace(old, new, 1)
          if updated.count('devices.length === 0 && legacyToken') != 1:
              raise SystemExit('Patch-Prüfung fehlgeschlagen.')

          path.write_text(updated, encoding='utf-8')
          PY

      - name: Syntax check
        run: node --check cloudflare/mf35x-push-watch/src/index.js

      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/mf35x-push-watch/src/index.js
          git commit -m "Fix legacy push fallback with registered devices"
          git pull --rebase origin main
          git push origin HEAD:main
